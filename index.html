<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Himmel">
<title>Himmel – Wetter mit Verlässlichkeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.18); --glass:rgba(255,255,255,.08); --glass-2:rgba(255,255,255,.14);
  --ok:#5be39a; --warn:#ffd166; --bad:#ff8c5a; --worst:#ff5c7a; --rain:#7cc4ff;
  --sat-top:env(safe-area-inset-top,0px); --sat-bot:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root[data-ink="dark"]{
  --ink:#121826; --ink-2:rgba(18,24,38,.72); --ink-3:rgba(18,24,38,.5);
  --line:rgba(18,24,38,.16); --glass:rgba(255,255,255,.28); --glass-2:rgba(255,255,255,.42);
  --ok:#1f9d5f; --warn:#b98400; --bad:#d9532b; --worst:#c81e45; --rain:#1f6fb8;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:#0b2a6b;
  font-feature-settings:"tnum" 1,"ss01" 1; line-height:1.4;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.cl{position:absolute;background-size:100% 100%;background-repeat:no-repeat;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes driftR{from{transform:translateX(calc(-1 * var(--w)))}to{transform:translateX(var(--vw))}}
@keyframes driftL{from{transform:translateX(var(--vw))}to{transform:translateX(calc(-1 * var(--w)))}}
.px{position:absolute;inset:-256px 0 0 0;background-repeat:repeat;background-size:256px 256px;will-change:background-position;animation:fall linear infinite}
@keyframes fall{from{background-position:0 0}to{background-position:-12px 256px}}
.px.snow{animation-name:snowfall}
@keyframes snowfall{from{background-position:0 0}to{background-position:40px 256px}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 11s ease-in-out infinite}
@keyframes flash{0%,96%,100%{opacity:0}97%{opacity:.18}98%{opacity:0}99%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.cl,.px,.flash{animation:none!important}}
#scrim{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,12,28,.42) 0%,rgba(6,12,28,.30) 40%,rgba(6,12,28,.18) 100%)}
:root[data-ink="dark"] #scrim{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.15))}
.hero .date,.hero .cond,.hero .sub,.hero .today{text-shadow:0 1px 2px rgba(0,0,0,.35),0 2px 14px rgba(0,0,0,.25)}
:root[data-ink="dark"] .hero .date,:root[data-ink="dark"] .hero .cond,:root[data-ink="dark"] .hero .sub,:root[data-ink="dark"] .hero .today{text-shadow:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--sat-top) + 14px) 20px calc(var(--sat-bot) + 40px)}

/* top bar */
.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;margin:calc(-1 * (var(--sat-top) + 14px)) -20px 0;padding:calc(var(--sat-top) + 10px) 20px 10px;background:var(--topbg);box-shadow:0 1px 0 var(--edge)}
:root{--topbg:rgba(10,16,32,.78)}
:root[data-ink="dark"]{--topbg:rgba(255,255,255,.85)}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat-top);z-index:6;background:transparent}
.loc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:inherit;font-weight:600;font-size:17px;padding:8px 0;text-align:left;cursor:pointer}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc svg{flex:none;opacity:.7}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib:active{background:var(--glass-2)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* hero */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body:not(.ready) .hero,body:not(.ready) section,body:not(.ready) .rel{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero{margin-top:22px}
section:nth-of-type(1){animation-delay:.08s}section:nth-of-type(2){animation-delay:.14s}section:nth-of-type(3){animation-delay:.2s}section:nth-of-type(4){animation-delay:.26s}section:nth-of-type(5){animation-delay:.32s}
.rel{animation-delay:.05s}
.date{color:var(--ink);opacity:.8;font-size:15px}
.now{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:4px}
.temp{font-size:132px;line-height:.9;font-weight:200;letter-spacing:-.055em;margin-left:-6px;text-shadow:0 2px 4px rgba(0,0,0,.35),0 6px 36px rgba(0,0,0,.35)}
:root[data-ink="dark"] .temp{text-shadow:none}
.temp sup{font-size:.42em;font-weight:400;vertical-align:top;line-height:1;margin-left:2px;position:relative;top:.12em}
.now .ico{width:112px;height:112px;flex:none;margin-top:10px}
.cond{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.sub{color:var(--ink);opacity:.85;font-size:15px;margin-top:2px}

/* quick days under hero */
.qd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:18px}
.qd button{min-width:0;padding:10px 2px 9px;border:1px solid var(--edge);border-radius:16px;background:var(--glass);color:var(--ink);font:inherit;text-align:center;cursor:pointer;display:grid;justify-items:center;gap:1px}
.qd button:active{background:var(--glass-2);transform:scale(.97)}
.qd button{transition:transform .15s ease}
.qd .qn{font-size:12px;color:var(--ink-2);white-space:nowrap}
.qd svg{width:26px;height:26px;margin:2px 0}
.qd .qt{font-size:13px;font-weight:600;line-height:1.15}
.qd .qt span{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.qd .qdot{width:6px;height:6px;border-radius:50%;background:var(--lvl);margin-top:3px}
@media (min-width:600px){.qd .qn{font-size:13px}.qd .qt{font-size:14px}}
/* reliability */
.rel{margin-top:14px;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--edge)}
.rel .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rel b{font-weight:600}
.rel .t{font-size:15px}
.rel .pct{font-size:15px;color:var(--ink-2)}
.meter{position:relative;height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--worst),var(--bad),var(--warn),var(--ok));background-size:var(--full) 100%;box-shadow:0 0 12px var(--lvl)}
.rel p{margin:10px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45}

/* sections */
section{margin-top:14px;padding:18px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--edge)}
:root{--glass:rgba(14,22,40,.6);--edge:rgba(255,255,255,.09)}
:root[data-ink="dark"]{--glass:rgba(255,255,255,.74);--edge:rgba(18,24,38,.1)}
h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink);letter-spacing:-.005em}
h2 small{font-weight:400;color:var(--ink-3)}

/* nowcast */
.nc{display:flex;align-items:flex-end;gap:3px;height:54px}
.nc i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#bfe3ff,var(--rain));min-height:2px;opacity:.95}
.nc i.z{opacity:.28}
.ncx{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;margin-top:6px}
.ncs{font-size:17px;font-weight:600;margin-bottom:10px}

/* hourly */
.hs{overflow-x:auto;overflow-y:hidden;margin:0 -16px;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.hs::-webkit-scrollbar{display:none}
.hours{position:relative;display:flex;width:max-content;height:170px;overflow:hidden}
.hours svg{position:absolute;left:0;top:54px;height:70px;pointer-events:none;overflow:visible}
.hour{width:58px;flex:none;text-align:center;font-size:12.5px}
.hour .hh{color:var(--ink-2)}
.hour .hi{width:30px;height:30px;margin:6px auto 0}
.hour .ht{position:relative;height:70px}
.hour .ht b{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:15px;white-space:nowrap}
.hour .hp{color:var(--rain);font-weight:600;height:18px}
.hour.first .hh{color:var(--ink);font-weight:600}

/* hourly wind */
.hour .hw{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);margin-top:2px}
.hour .hw svg{width:12px;height:12px;opacity:.8}
/* alerts */
.warn{margin-top:14px;border-radius:20px;padding:4px 14px 10px;border:1px solid var(--edge);background:var(--glass)}
.warn.sev-minor{border-color:rgba(255,209,102,.5)}.warn.sev-moderate{border-color:rgba(255,160,60,.7)}.warn.sev-severe{border-color:rgba(255,92,90,.8)}.warn.sev-extreme{border-color:rgba(200,30,70,.95)}
.warn details{padding:10px 0;border-top:1px solid var(--edge)}.warn details:first-child{border-top:0}
.warn summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr;gap:2px}
.warn summary::-webkit-details-marker{display:none}
.warn .wsev{font-size:12px;font-weight:600;color:var(--warn)}
.sev-severe .wsev,.sev-extreme .wsev{color:var(--worst)}
.warn summary b{font-size:15px}
.warn summary small{color:var(--ink-2);font-size:12.5px}
.warn p{margin:8px 0 0;font-size:14px;line-height:1.45}
.warn .wins{color:var(--ink-2)}
.warn .wsrc{font-size:11.5px;color:var(--ink-3);padding-top:8px}
/* air & pollen */
.air{display:grid;gap:12px}
.aq small{display:block;color:var(--ink-2);font-size:13px}
.aq b{font-size:20px;font-weight:600;display:block}
.aq em{font-style:normal;color:var(--ink-2);font-size:13px}
.pol{display:flex;flex-wrap:wrap;gap:8px}
.pol span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--glass-2);font-size:13px}
.pol i{width:8px;height:8px;border-radius:50%}
/* daily */
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:44px 32px 36px 1fr 10px;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--edge);background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.day:first-child{border-top:0}
.day .dn{font-weight:600;font-size:15px}
.day .di{width:30px;height:30px}
.day .dp{font-size:13px;color:var(--rain);font-weight:600}
.day .bar{position:relative;height:28px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;font-size:15px}
.day .bar .lo{text-align:right;color:var(--ink-2)}
.day .bar .hi{font-weight:600}
.day .bar .tr{position:relative;height:6px;border-radius:3px;background:var(--line)}
.day .bar .tr u{position:absolute;top:-3px;bottom:-3px;border-radius:6px;background:var(--line);opacity:.9}
.day .bar .tr i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6fc3ff,#ffd166,#ff8c5a);background-repeat:no-repeat}
.day .dot{width:10px;height:10px;border-radius:50%;background:var(--lvl)}
.models{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.7,.2,1)}
.models>div{overflow:hidden;min-height:0}
.models.open{grid-template-rows:1fr}
.models .inner{padding:6px 0 14px 0;font-size:14px}
.dsum{font-size:14.5px;line-height:1.45;margin:0 0 10px}
.dsum b{font-weight:600}
.pbars{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:6px}
.pbars i{flex:1;min-height:2px;border-radius:2px 2px 0 0;background:var(--rain);opacity:.9}
.pbars i.z{opacity:.22}
.pbars i.w{background:linear-gradient(180deg,#ffffff,var(--rain))}
.pbars i.past{opacity:.18;filter:saturate(0)}
.pbx{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11px;margin-top:4px}
.models .mt{color:var(--ink-2);margin:12px 0 6px;font-size:13px}
.hero .today{font-size:15.5px;margin-top:12px;line-height:1.5;padding-left:12px;border-left:2px solid var(--rain)}
.models .mh{color:var(--ink-2);margin-bottom:8px}
.models .mr{display:grid;grid-template-columns:1fr 70px 60px;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.models .mr span:nth-child(2),.models .mr span:nth-child(3){text-align:right}
.models .mr.na{color:var(--ink-3)}

/* radar */
.radar{position:relative;border-radius:16px;overflow:hidden;background:#c9d3df;cursor:pointer}
.radar canvas{display:block;width:100%;height:200px;pointer-events:none}
.pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#e5343a;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35),0 0 0 5px rgba(229,52,58,.22);pointer-events:none}
.radar .att,.rmap .att{position:absolute;left:8px;bottom:6px;font-size:10px;color:rgba(20,28,40,.75);text-shadow:0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.radar .tap{position:absolute;right:10px;top:10px;padding:6px 10px;border-radius:999px;background:rgba(15,26,46,.82);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;pointer-events:none}
.radar .rt{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:rgba(15,26,46,.82);color:#fff;font-size:12px;font-weight:600;pointer-events:none}
.rmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;font-size:14px;line-height:1.5;background:rgba(15,26,46,.82)}
.rmsg[hidden]{display:none}
/* radar fullscreen */
.rfull{position:fixed;inset:0;z-index:7;background:#c9d3df;color:#fff;display:flex;flex-direction:column;animation:fadein .25s ease both}
.rfull[hidden]{display:none}
.rfh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--sat-top) + 10px) 16px 10px;background:#0f1a2e}
.rfh h1{margin:0;font-size:18px;font-weight:600}
.rfh h1 small{display:block;font-size:13px;font-weight:400;color:rgba(255,255,255,.6)}
.rfh button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.rmap{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab;overflow:hidden}
.rmap:active{cursor:grabbing}
.rmap canvas{display:block;width:100%;height:100%}
.rmap .zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.rmap .zoom button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(15,26,46,.88);color:#fff;font:inherit;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.rmap .home{position:absolute;right:12px;top:112px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(15,26,46,.88);color:#fff;display:grid;place-items:center;cursor:pointer}
.rfc{padding:12px 16px calc(var(--sat-bot) + 14px);background:#0f1a2e}
.rfc .row{display:flex;align-items:center;gap:12px}
.rfc .play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#7cc4ff;color:#0d1626;font-size:16px;cursor:pointer}
.rfc .tl{flex:1;font-size:22px;font-weight:600;font-feature-settings:"tnum" 1}
.rfc .tl small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.6)}
.rfc input{width:100%;margin-top:10px;accent-color:#7cc4ff;height:28px}
.rfc .ticks{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.rfc .ticks b{color:#7cc4ff;font-weight:600}
/* details */
.det{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.det div{padding:13px 0;border-top:1px solid var(--edge)}
.det div:nth-child(-n+2){border-top:0}
.det small{display:block;color:var(--ink-2);font-size:13px}
.det b{display:block;font-size:19px;font-weight:600;margin-top:2px}
.det b em{font-style:normal;font-weight:400;font-size:14px;color:var(--ink-2)}

/* footer */
.foot{margin-top:30px;color:var(--ink-3);font-size:12px;line-height:1.55}
.foot button{background:none;border:0;color:var(--ink-2);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* states */
.msg{margin-top:40px;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);font-size:15px;line-height:1.5}
.msg b{display:block;font-size:17px;margin-bottom:6px}
.msg button{margin-top:12px;margin-right:8px;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#0b2a6b;font:inherit;font-weight:600;cursor:pointer}
:root[data-ink="dark"] .msg button{color:#fff}
.skel{opacity:.55}
.skel .temp,.skel .cond,.skel .sub,.skel .date{color:transparent;background:var(--glass);border-radius:8px}

/* search overlay */
.search{position:fixed;inset:0;z-index:5;background:rgba(6,12,28,.97);color:#fff;overflow:auto;animation:fadein .25s ease both}
.search[hidden]{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sw{max-width:560px;margin:0 auto;padding:calc(var(--sat-top) + 16px) 20px calc(var(--sat-bot) + 30px);animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
.sh button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.sin{position:relative;margin-top:18px}
.sin svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.65;pointer-events:none}
.sin input{width:100%;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.18);padding:0 16px 0 48px;font:inherit;font-size:18px;background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sin input::placeholder{color:rgba(255,255,255,.5)}
.sin input::-webkit-search-cancel-button{-webkit-appearance:none}
.gps{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border:0;border-radius:18px;background:linear-gradient(135deg,rgba(124,196,255,.35),rgba(124,196,255,.12));color:#fff;font:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.gps small{display:block;font-weight:400;font-size:13px;color:rgba(255,255,255,.7)}
.res h3{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin:24px 0 10px}
.favs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{position:relative;display:grid;gap:2px;padding:14px 14px 12px;border:0;border-radius:18px;background:rgba(255,255,255,.12);color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);min-height:96px}
.fc .fn{font-size:16px;font-weight:600;padding-right:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc small{color:rgba(255,255,255,.6);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:24px;font-weight:300;min-height:30px}
.fc .ft svg{width:30px;height:30px}
.fc .ft em{font-style:normal;font-size:12px;color:rgba(255,255,255,.5);font-weight:400}
.fc .star{position:absolute;right:8px;top:8px;padding:6px;color:#ffd166;opacity:.95}
.fc .star svg{display:block}

(() => {
'use strict';
/* ---------- config ---------- */
const VERSION = '2.11.02-12';
const API = 'https://api.open-meteo.com/v1/forecast';
const GEO = 'https://geocoding-api.open-meteo.com/v1/search';
const MODELS = [
  ['icon_seamless', 'DWD ICON'],
  ['ecmwf_ifs025', 'ECMWF IFS'],
  ['gfs_seamless', 'NOAA GFS'],
  ['meteofrance_seamless', 'Météo-France'],
  ['ukmo_seamless', 'UK Met Office'],
];
const LS = { loc: 'himmel.loc', favs: 'himmel.favs', cache: 'himmel.cache' };
const $ = s => document.querySelector(s);
const app = $('#app');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ---------- weather codes ---------- */
const WMO = {
  0: ['Klar', 'sun'], 1: ['Überwiegend klar', 'sun'], 2: ['Teils bewölkt', 'suncloud'], 3: ['Bedeckt', 'cloud'],
  45: ['Nebel', 'fog'], 48: ['Reifnebel', 'fog'],
  51: ['Leichter Niesel', 'drizzle'], 53: ['Niesel', 'drizzle'], 55: ['Starker Niesel', 'drizzle'],
  56: ['Gefrierender Niesel', 'sleet'], 57: ['Gefrierender Niesel', 'sleet'],
  61: ['Leichter Regen', 'rain'], 63: ['Regen', 'rain'], 65: ['Starker Regen', 'heavyrain'],
  66: ['Gefrierender Regen', 'sleet'], 67: ['Gefrierender Regen', 'sleet'],
  71: ['Leichter Schnee', 'snow'], 73: ['Schnee', 'snow'], 75: ['Starker Schnee', 'snow'], 77: ['Schneegriesel', 'snow'],
  80: ['Leichte Schauer', 'shower'], 81: ['Schauer', 'shower'], 82: ['Heftige Schauer', 'heavyrain'],
  85: ['Schneeschauer', 'snow'], 86: ['Starke Schneeschauer', 'snow'],
  95: ['Gewitter', 'thunder'], 96: ['Gewitter mit Hagel', 'thunder'], 99: ['Gewitter mit Hagel', 'thunder'],
};
const wmo = c => WMO[c] || ['Wechselhaft', 'cloud'];

/* ---------- icons (inline SVG) ---------- */
function icon(kind, day = true, cls = '') {
  const sun = `<circle cx="12" cy="12" r="5" fill="#FFD166"/><g stroke="#FFD166" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>`;
  const moon = `<path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.4A7 7 0 0 1 15.5 3.5z" fill="#E9EEF7"/>`;
  const cloud = (x = 0, y = 0, s = 1, c = '#F4F7FB') => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 17.9 9.1 4.5 4.5 0 0 1 17.5 18z" fill="${c}"/></g>`;
  const dark = '#C9D2E1';
  const drops = (n, c = '#7CC4FF') => { let s = ''; for (let i = 0; i < n; i++) s += `<path d="M${8 + i * 3.6} 19.5l-1 2.4" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`; return s; };
  const flakes = () => { let s = ''; for (let i = 0; i < 3; i++) s += `<circle cx="${8.5 + i * 3.6}" cy="21" r="1.1" fill="#fff"/>`; return s; };
  const bolt = `<path d="M12.5 17l-2.2 4.6h2.2L11.3 25l3.8-5.2h-2.1L14.3 17z" fill="#FFD166"/>`;
  let body = '';
  switch (kind) {
    case 'sun': body = day ? sun : moon; break;
    case 'suncloud': body = (day ? `<g transform="translate(-4 -4) scale(.85)">${sun}</g>` : `<g transform="translate(-4 -4) scale(.8)">${moon}</g>`) + cloud(2, 2, .9); break;
    case 'cloud': body = cloud(0, 0, 1, dark); break;
    case 'fog': body = cloud(0, -3, .9, dark) + `<g stroke="#E9EEF7" stroke-width="1.6" stroke-linecap="round"><path d="M5 19h13M7 22h10"/></g>`; break;
    case 'drizzle': body = cloud(0, -2, .95, dark) + drops(3, '#A9D8FF'); break;
    case 'rain': body = cloud(0, -2, .95, dark) + drops(3); break;
    case 'heavyrain': body = cloud(0, -2, .95, '#9AA7BB') + drops(4); break;
    case 'shower': body = `<g transform="translate(-4 -5) scale(.7)">${day ? sun : moon}</g>` + cloud(1, -1, .95, dark) + drops(3); break;
    case 'sleet': body = cloud(0, -2, .95, dark) + drops(2) + `<circle cx="16" cy="21" r="1.1" fill="#fff"/>`; break;
    case 'snow': body = cloud(0, -2, .95, dark) + flakes(); break;
    case 'thunder': body = cloud(0, -3, .95, '#8E9BB1') + bolt; break;
    default: body = cloud(0, 0, 1, dark);
  }
  return `<svg class="${cls}" viewBox="0 0 24 26" aria-hidden="true">${body}</svg>`;

/* ---------- helpers ---------- */
const hm = t => (t || '').slice(11, 16);
const deg = v => `${Math.round(v)}°`;
const compass = d => ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8];

const longDate = iso => new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(iso.slice(0, 10) + 'T12:00:00'));
const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- model agreement ---------- */
function consensus(mm, i) {
  const tmax = [], tmin = [], rain = [], per = [];
  for (const [k, name] of MODELS) {
    const d = mm && mm.daily;
    const a = d && d['temperature_2m_max_' + k] ? d['temperature_2m_max_' + k][i] : null;
    const b = d && d['temperature_2m_min_' + k] ? d['temperature_2m_min_' + k][i] : null;
    const c = d && d['precipitation_sum_' + k] ? d['precipitation_sum_' + k][i] : null;
    per.push({ name, tmax: a, tmin: b, rain: c });
    if (a != null && b != null) { tmax.push(a); tmin.push(b); }
    if (c != null) rain.push(c);
  }
  if (tmax.length < 2) return { n: tmax.length, score: null, per };
  const sp = (Math.max(...tmax) - Math.min(...tmax) + Math.max(...tmin) - Math.min(...tmin)) / 2;
  const wet = rain.filter(r => r >= 0.5).length;
  const agree = rain.length ? Math.max(wet, rain.length - wet) / rain.length : 1;
  const rainSpread = rain.length ? Math.max(...rain) - Math.min(...rain) : 0;
  let score = 100 - sp * 9 - (1 - agree) * 55 - Math.min(rainSpread, 10) * 1.5;
  score = Math.max(5, Math.min(100, Math.round(score)));
  return { n: tmax.length, score, spread: sp, agree, tmax: median(tmax), tmin: median(tmin), tmaxLo: Math.min(...tmax), tmaxHi: Math.max(...tmax), tminLo: Math.min(...tmin), rain: rain.length ? median(rain) : null, wet, nRain: rain.length, per };
}

/* ---------- data ---------- */
async function getJSON(url, ms = 12000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.reason || ('HTTP ' + r.status));
    return j;
  } finally { clearTimeout(t); }
}
async function loadWeather(lat, lon) {
  const base = { latitude: lat, longitude: lon, timezone: 'auto', wind_speed_unit: 'kmh' };
  const main = new URLSearchParams({ ...base, forecast_days: 7, past_days: 1,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure,cloud_cover',

    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,uv_index_max' });
  const multi = new URLSearchParams({ ...base, forecast_days: 7, models: MODELS.map(m => m[0]).join(','),
    daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum' });
  const nc = new URLSearchParams({ ...base, minutely_15: 'precipitation', forecast_minutely_15: 12 });
  const air = new URLSearchParams({ latitude: lat, longitude: lon, timezone: 'auto', current: 'european_aqi,pm10,pm2_5,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,ragweed_pollen' });
  const [a, b, c, q, w] = await Promise.all([
    getJSON(API + '?' + main),
    getJSON(API + '?' + multi).catch(() => null),
    getJSON(API + '?' + nc).catch(() => null),
    getJSON('https://air-quality-api.open-meteo.com/v1/air-quality?' + air).catch(() => null),
    getJSON(`https://api.brightsky.dev/alerts?lat=${lat}&lon=${lon}&tz=Europe/Berlin`, 8000).catch(() => null),
  ]);
  // yesterday comparison, then drop the past day from daily arrays
  let yday = null;
  const todayStr = a.current.time.slice(0, 10), off = a.daily.time.indexOf(todayStr);
  const hIdx = a.hourly.time.indexOf(a.current.time.slice(0, 13) + ':00');
  if (hIdx >= 24 && a.hourly.temperature_2m[hIdx - 24] != null) yday = { t: a.hourly.temperature_2m[hIdx - 24], code: a.hourly.weather_code[hIdx - 24] };
  if (off > 0) for (const k of Object.keys(a.daily)) if (Array.isArray(a.daily[k])) a.daily[k] = a.daily[k].slice(off);
  const alerts = w && Array.isArray(w.alerts) ? w.alerts.filter(x => x.status !== 'test') : null;
  return { main: a, multi: b, nowcast: c, air: q, alerts, yday, at: Date.now() };
}

    return j.city || j.locality || j.principalSubdivision || null;

  for (let i = hi; i < Math.min(hi + 24, H.time.length); i++) hours.push(i);
  const temps = hours.map(i => H.temperature_2m[i]);
  const tMin = Math.min(...temps), tMax = Math.max(...temps), span = Math.max(4, tMax - tMin);
  const colW = 58, curveH = 70;
  const y = v => 24 + (1 - (v - tMin) / span) * 42;
  let path = '';
  hours.forEach((i, k) => { path += (k ? ' L' : 'M') + (k * colW + colW / 2) + ' ' + y(H.temperature_2m[i]).toFixed(1); });
  const area = path + ` L${(hours.length - 1) * colW + colW / 2} ${curveH} L${colW / 2} ${curveH} Z`;

  // daily scale
  const allMin = Math.min(...D.temperature_2m_min), allMax = Math.max(...D.temperature_2m_max), allSpan = Math.max(1, allMax - allMin);

  // nowcast
  let ncHTML = '', ncDryUntil = -1;
  if (nc && nc.minutely_15 && nc.minutely_15.time) {
    const T = nc.minutely_15.time, P = nc.minutely_15.precipitation;
    const q = Math.floor(parseInt(cur.time.slice(14, 16), 10) / 15) * 15;
    const curQ = cur.time.slice(0, 14) + String(q).padStart(2, '0');
    let s = T.indexOf(curQ); if (s < 0) s = 0;
    const idx = []; for (let i = s; i < Math.min(s + 12, T.length); i++) idx.push(i);
    if (idx.length) {
      const vals = idx.map(i => P[i] ?? 0);
      const mx = Math.max(0.6, ...vals);
      const firstWet = vals.findIndex(v => v >= 0.1);
      const firstDry = vals.findIndex((v, k) => k > 0 && v < 0.1 && vals[0] >= 0.1);
      let headline;
      if (firstWet < 0) { headline = 'Kein Regen in den nächsten 3 Stunden'; ncDryUntil = parseInt(T[idx[idx.length - 1]].slice(11, 13), 10); }
      else if (firstWet > 0) ncDryUntil = parseInt(T[idx[firstWet]].slice(11, 13), 10) - 1;
      else if (firstWet === 0) headline = firstDry > 0 ? `Regen lässt gegen ${hm(T[idx[firstDry]])} nach` : 'Regen hält die nächsten 3 Stunden an';
      else headline = `Regen ab etwa ${hm(T[idx[firstWet]])}`;
      ncHTML = `<section aria-label="Regen in den nächsten 3 Stunden">
        <div class="ncs">${headline}</div>
        <div class="nc">${vals.map(v => `<i class="${v < 0.1 ? 'z' : ''}" style="height:${Math.max(2, v / mx * 54)}px" title="${v.toFixed(1)} mm"></i>`).join('')}</div>
        <div class="ncx"><span>jetzt</span><span>1 Std.</span><span>2 Std.</span><span>3 Std.</span></div>
      </section>`;
    }
  }

  // reliability text
  let relHTML = '';
  if (today.score != null) {
    const [lbl, col] = level(today.score);
    const rainTxt = today.nRain ? (today.wet === today.nRain ? 'Alle Modelle erwarten Niederschlag.' : today.wet === 0 ? 'Kein Modell erwartet nennenswerten Niederschlag.' : `${today.wet} von ${today.nRain} Modellen erwarten Niederschlag.`) : '';
    relHTML = `<div class="rel" style="--lvl:${col}">
      <div class="row"><span class="t"><b>${lbl}</b> für heute</span><span class="pct">${today.n} Modelle</span></div>

  const todayDS = daySummary(H, D, 0, parseInt(cur.time.slice(11, 13), 10), ncDryUntil);
  const dailyHTML = D.time.map((t, i) => {
    const c = consensus(mm, i);
    const [lbl, col] = level(c.score);
    const [, k] = wmo(i === 0 && todayDS ? todayDS.code : D.weather_code[i]);
    const lo = D.temperature_2m_min[i], hi2 = D.temperature_2m_max[i];

    let ghost = '';
    if (c.score != null) {
      const gl = Math.max(0, (Math.min(c.tminLo, lo) - allMin) / allSpan * 100), gr = Math.min(100, (Math.max(c.tmaxHi, hi2) - allMin) / allSpan * 100);

    const rows = c.per.map(p => p.tmax == null

    const ds = daySummary(H, D, i, i === 0 ? parseInt(cur.time.slice(11, 13), 10) : 0, i === 0 ? ncDryUntil : -1);

      <div class="pbars">${ds.pp.map((v, j) => { const past = i === 0 && j < parseInt(cur.time.slice(11, 13), 10); const dry = i === 0 && j <= ncDryUntil && !past; return `<i class="${v < 20 || dry ? 'z' : ''} ${ds.pr[j] >= 0.8 && !dry ? 'w' : ''} ${past ? 'past' : ''}" style="height:${Math.max(2, (dry ? 0 : v) / 100 * 44)}px" title="${j} Uhr: ${v} %, ${ds.pr[j].toFixed(1)} mm${past ? ' (vergangen)' : dry ? ' (Radar: trocken)' : ''}"></i>`; }).join('')}</div>

    return `<button class="day" data-i="${i}" aria-expanded="${openDay === i}" style="--lvl:${col}">

    </button>
    <div class="models ${openDay === i ? 'open' : ''}"><div><div class="inner">${dayHTML}<div class="mt">Modellvergleich</div><div class="mh">${mh}</div>${rows}</div></div></div>`;
  }).join('');

  const upd = new Date(data.at);
  // yesterday
  let ydayTxt = '';
  if (data.yday) { const dT = Math.round(cur.temperature_2m - data.yday.t); ydayTxt = dT === 0 ? ', wie gestern um diese Zeit' : `, ${Math.abs(dT)}° ${dT > 0 ? 'wärmer' : 'kälter'} als gestern um diese Zeit`; }
  // DWD alerts
  let alertsHTML = '';
  if (data.alerts && data.alerts.length) {
    const sevRank = { minor: 1, moderate: 2, severe: 3, extreme: 4 }, sevName = { minor: 'Wetterwarnung', moderate: 'Markante Wetterwarnung', severe: 'Unwetterwarnung', extreme: 'Extreme Unwetterwarnung' };
    const list = [...data.alerts].sort((x, y) => (sevRank[y.severity] || 0) - (sevRank[x.severity] || 0));
    const fmtT = iso => iso ? new Date(iso).toLocaleString('de-DE', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    alertsHTML = `<div class="warn sev-${list[0].severity || 'minor'}">${list.slice(0, 3).map(al => `

      <div class="wsrc">Amtliche Warnung des Deutschen Wetterdienstes${list.length > 3 ? `, ${list.length - 3} weitere` : ''}</div></div>`;
  }
  // air quality & pollen
  let airHTML = '';
  if (data.air && data.air.current) {
    const ac = data.air.current, aqi = ac.european_aqi;
    const aqiL = aqi == null ? null : aqi <= 20 ? ['Gut', 'var(--ok)'] : aqi <= 40 ? ['Mittel', '#a3e635'] : aqi <= 60 ? ['Mäßig', 'var(--warn)'] : aqi <= 80 ? ['Schlecht', 'var(--bad)'] : ['Sehr schlecht', 'var(--worst)'];
    const pol = [['Gräser', ac.grass_pollen], ['Birke', ac.birch_pollen], ['Erle', ac.alder_pollen], ['Beifuß', ac.mugwort_pollen], ['Ambrosia', ac.ragweed_pollen]].filter(x => x[1] != null);
    const polL = v => v < 1 ? ['keine', 'var(--ink-3)'] : v < 10 ? ['gering', 'var(--ok)'] : v < 50 ? ['mittel', 'var(--warn)'] : ['hoch', 'var(--worst)'];
    const active = pol.filter(x => x[1] >= 1).sort((x, y) => y[1] - x[1]);
    airHTML = `<section aria-label="Luft und Pollen"><h2>Luft und Pollen</h2>
      <div class="air">${aqiL ? `<div class="aq"><small>Luftqualität</small><b style="color:${aqiL[1]}">${aqiL[0]}</b><em>Index ${Math.round(aqi)}, Feinstaub PM2,5 ${ac.pm2_5 != null ? Math.round(ac.pm2_5) : '–'} µg/m³</em></div>` : ''}
      <div class="pol">${active.length ? active.slice(0, 4).map(([n, v]) => { const [l, c] = polL(v); return `<span><i style="background:${c}"></i>${n}: ${l}</span>`; }).join('') : '<span><i style="background:var(--ok)"></i>Pollenflug: derzeit kein nennenswerter</span>'}</div></div></section>`;
  }
  // moon phase (Conway-style approximation, good to a day)
  const moonPhase = (() => { const d = new Date(cur.time.slice(0, 10) + 'T12:00:00'); const syn = 29.530588853; const ref = Date.UTC(2000, 0, 6, 18, 14); const age = ((d.getTime() - ref) / 86400000) % syn; const a = (age + syn) % syn; const f = a / syn;
    const names = ['Neumond', 'Zunehmende Sichel', 'Erstes Viertel', 'Zunehmender Mond', 'Vollmond', 'Abnehmender Mond', 'Letztes Viertel', 'Abnehmende Sichel'];
    return { name: names[Math.round(f * 8) % 8], pct: Math.round((1 - Math.cos(f * 2 * Math.PI)) / 2 * 100) }; })();
  const demoNote = data.demo ? 'Beispieldaten zur Vorschau – keine echte Vorhersage. ' : '';
  app.innerHTML = `
  <div class="hero">
    <div class="date">${longDate(cur.time)}, ${hm(cur.time)}</div>
    <div class="now">
      <div class="temp">${Math.round(cur.temperature_2m)}<sup>°</sup></div>
      ${icon(condKind, day, 'ico')}
    </div>
    <div class="cond">${condText}</div>
    <div class="sub">Gefühlt ${deg(cur.apparent_temperature)}, heute ${deg(D.temperature_2m_min[0])} bis ${deg(D.temperature_2m_max[0])}${ydayTxt}</div>
    ${alertsHTML}
    ${todayDS ? `<div class="today">${todayDS.txt}</div>` : ''}
    <div class="qd" aria-label="Nächste Tage">${D.time.map((t, i) => { const c = consensus(mm, i), [lbl, col] = level(c.score), [, k] = wmo(i === 0 && todayDS ? todayDS.code : D.weather_code[i]); return `<button data-go="${i}" style="--lvl:${col}" title="${lbl}"><span class="qn">${i === 0 ? 'Heute' : wd(t).replace('.', '')}</span>${icon(k, true)}<span class="qt">${deg(D.temperature_2m_max[i])} <span>${deg(D.temperature_2m_min[i])}</span></span><span class="qdot"></span></button>`; }).join('')}</div>
    ${relHTML}
  </div>
  ${ncHTML}
  <section aria-label="Regenradar">
    <h2>Regenradar <small>– letzte 2 Stunden und 30 Minuten voraus</small></h2>
    <div class="radar" id="radar" role="button" tabindex="0" aria-label="Regenradar vergrößern"><canvas id="rcv"></canvas><div class="pin"></div>
      <div class="rt" id="rtmini">–</div>
      <div class="tap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>Vergrößern</div>
      <div class="att">Radar und Satellit: RainViewer, Karte: © OpenStreetMap</div>
      <div class="rmsg" id="rmsg" hidden></div>
    </div>
  </section>
  <section aria-label="Nächste 24 Stunden">
    <h2>Nächste 24 Stunden</h2>
    <div class="hs"><div class="hours" style="width:${hours.length * colW}px">
      <svg width="${hours.length * colW}" height="${curveH}" viewBox="0 0 ${hours.length * colW} ${curveH}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#ag)"/><path d="${path}" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${hours.map((i, k) => { const hDry = ncDryUntil >= 0 && H.time[i].slice(0, 10) === cur.time.slice(0, 10) && parseInt(H.time[i].slice(11, 13), 10) <= ncDryUntil; let code = H.weather_code[i]; if (hDry && code >= 51) code = 3; const [, kk] = wmo(code); const p = hDry ? 0 : H.precipitation_probability[i]; return `<div class="hour ${k === 0 ? 'first' : ''}">
        <div class="hh">${k === 0 ? 'Jetzt' : parseInt(hm(H.time[i]), 10) + ' Uhr'}</div>

        <div class="ht"><b style="top:${(y(H.temperature_2m[i]) - 22).toFixed(0)}px">${deg(H.temperature_2m[i])}</b></div>
        <div class="hp">${p >= 20 ? p + '%' : ''}</div>
        <div class="hw"><svg viewBox="0 0 24 24" style="transform:rotate(${((H.wind_direction_10m && H.wind_direction_10m[i]) || 0) + 180}deg)"><path d="M12 3l5 10h-4v8h-2v-8H7z" fill="currentColor"/></svg>${H.wind_speed_10m ? Math.round(H.wind_speed_10m[i]) : ''}</div>
      </div>`; }).join('')}
    </div></div>
  </section>
  <section aria-label="7 Tage">
    <h2>7 Tage <small>– Punkt rechts zeigt, wie einig sich die Modelle sind. Tag antippen für Details.</small></h2>
    <div class="days">${dailyHTML}</div>
  </section>
  <section aria-label="Details">
    <h2>Jetzt im Detail</h2>
    <div class="det">
      <div><small>Wind</small><b>${Math.round(cur.wind_speed_10m)} km/h <em>${compass(cur.wind_direction_10m)}, Böen ${Math.round(cur.wind_gusts_10m)}</em></b></div>
      <div><small>Luftfeuchte</small><b>${Math.round(cur.relative_humidity_2m)} %</b></div>
      <div><small>Luftdruck</small><b>${Math.round(cur.surface_pressure)} <em>hPa</em></b></div>
      <div><small>UV-Index heute</small><b>${D.uv_index_max[0] == null ? '–' : Math.round(D.uv_index_max[0])}</b></div>
      <div><small>Sonnenaufgang</small><b>${hm(D.sunrise[0])}</b></div>
      <div><small>Sonnenuntergang</small><b>${hm(D.sunset[0])}</b></div>
      <div><small>Niederschlag heute</small><b>${(D.precipitation_sum[0] ?? 0).toFixed(1)} <em>mm</em></b></div>
      <div><small>Bewölkung</small><b>${Math.round(cur.cloud_cover)} %</b></div>
      <div><small>Mond</small><b>${moonPhase.name} <em>${moonPhase.pct} %</em></b></div>
      <div><small>Wind-Spitze heute</small><b>${Math.round(D.wind_gusts_10m_max[0])} <em>km/h</em></b></div>
    </div>
  </section>
  ${airHTML}
  <div class="foot">${demoNote}Daten: Open-Meteo. Hauptvorhersage aus dem jeweils besten regionalen Modell (in Mitteleuropa DWD ICON). Verlässlichkeit aus dem Vergleich von ${MODELS.length} Modellen: ${MODELS.map(m => m[1]).join(', ')}. Aktualisiert ${upd.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} – <button id="refresh">neu laden</button><br>Version ${VERSION}</div>`;

  app.querySelectorAll('.day').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, was = openDay;

    app.querySelectorAll('.day').forEach(d => d.setAttribute('aria-expanded', +d.dataset.i === openDay));
    app.querySelectorAll('.models').forEach((m, k) => m.classList.toggle('open', k === openDay));
  }));
  app.querySelectorAll('.qd button').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.go, row = app.querySelector(`.day[data-i="${i}"]`);
    if (!row) return;

  }));
  document.body.classList.add('ready');
  $('#refresh').addEventListener('click', () => loadFor(data.demo ? { name: 'Marienhafe', lat: 53.52, lon: 7.27 } : loc, true));

function showMsg(title, text, ...actions) {
  app.innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(text)}${actions.length ? '<br>' + actions.map((a, i) => `<button class="mb" data-k="${i}">${esc(a[0])}</button>`).join(' ') : ''}</div>`;
  app.querySelectorAll('.mb').forEach(b => b.addEventListener('click', () => actions[+b.dataset.k][1]()));
}

async function loadFor(l, force) {
  if (!l) { openSearch(); showMsg('Kein Ort gewählt', 'Suche eine Stadt oder nutze deinen Standort.', ['Ort suchen', openSearch]); return; }
  loc = l; store.set(LS.loc, l);
  $('#locName').textContent = l.name;
  const cached = store.get(LS.cache, null);
  if (!force && cached && cached.key === l.lat + ',' + l.lon && Date.now() - cached.at < 10 * 60 * 1000) {
    data = cached; render(); return;
  }
  if (cached && cached.key === l.lat + ',' + l.lon) { data = cached; render(); app.classList.add('skel'); }
  else app.innerHTML = `<div class="hero skel"><div class="date">&nbsp;</div><div class="now"><div class="temp">00°</div></div><div class="cond">Lade Vorhersage</div><div class="sub">&nbsp;</div></div>`;
  try {
    const d = await loadWeather(l.lat, l.lon);
    d.key = l.lat + ',' + l.lon;
    data = d; store.set(LS.cache, d); app.classList.remove('skel'); render();
  } catch (e) {
    app.classList.remove('skel');
    if (cached && cached.key === l.lat + ',' + l.lon) { data = cached; render(); $('.foot').insertAdjacentHTML('afterbegin', 'Offline – zeigt gespeicherte Daten. '); }
    else showMsg('Vorhersage nicht geladen', (navigator.onLine ? 'Der Wetterdienst ist nicht erreichbar (' + (e.message || 'Fehler') + '). In einer Datei-Vorschau ist der Internetzugriff meist gesperrt.' : 'Keine Internetverbindung.') + ' Aufbau und Darstellung kannst du trotzdem ansehen.', ['Vorschau mit Beispieldaten', loadDemo], ['Erneut versuchen', () => loadFor(l, true)]);
  }
}

function loadDemo() {
  loc = { name: 'Marienhafe (Beispieldaten)', lat: 53.52, lon: 7.27 };
  $('#locName').textContent = loc.name;
  data = { ...DEMO, at: Date.now(), key: 'demo', demo: true, yday: { t: 5.1, code: 3 }, alerts: [{ status: 'actual', severity: 'moderate', event_de: 'STURMBÖEN', headline_de: 'Amtliche WARNUNG vor STURMBÖEN', description_de: 'Es treten Sturmböen mit Geschwindigkeiten zwischen 65 km/h und 85 km/h aus südwestlicher Richtung auf.', instruction_de: 'ACHTUNG! Hinweis auf mögliche Gefahren: Es können zum Beispiel einzelne Äste herabstürzen.', onset: new Date().toISOString(), expires: new Date(Date.now() + 8 * 3600e3).toISOString() }], air: { current: { european_aqi: 18, pm2_5: 6, grass_pollen: 0, birch_pollen: 0, alder_pollen: 0, mugwort_pollen: 0, ragweed_pollen: 0 } } };
  render();
}
function locate(retry) {
  if (!navigator.geolocation) { showMsg('Standort nicht verfügbar', 'Dein Browser erlaubt keine Standortabfrage. Suche den Ort manuell.', ['Ort suchen', openSearch], ['Vorschau mit Beispieldaten', loadDemo]); return; }
  $('#locName').textContent = 'Standort wird ermittelt';
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = +p.coords.latitude.toFixed(3), lon = +p.coords.longitude.toFixed(3);
    const l = { name: 'Mein Standort', lat, lon };
    loadFor(l, true);
    const n = await reverseName(lat, lon);
    if (n && loc && loc.lat === lat && loc.lon === lon) { loc.name = n; store.set(LS.loc, loc); $('#locName').textContent = n; }
  }, err => {
    if (err.code === 3 && !retry) { locate(true); return; } // timeout: second attempt with coarse accuracy
    const denied = err.code === 1;
    const title = denied ? 'Standort nicht freigegeben' : 'Standort nicht gefunden';
    const text = denied
      ? 'Safari darf deinen Standort nicht nutzen. Freigeben: In Safari auf „aA“ in der Adresszeile → Website-Einstellungen → Standort → Erlauben. Vom Home-Bildschirm aus: iPhone-Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites → Beim Verwenden.'
      : 'Kein GPS-Signal. Drinnen oder im Flugmodus kann das passieren.';
    if (loc) { $('#locName').textContent = loc.name; loadFor(loc, false); return; }
    $('#locName').textContent = 'Himmel';
    showMsg(title, text, ['Erneut versuchen', () => locate(false)], ['Ort suchen', openSearch]);
  }, retry ? { timeout: 15000, maximumAge: 10 * 60 * 1000, enableHighAccuracy: false } : { timeout: 8000, maximumAge: 5 * 60 * 1000 });
}

const sEl = $('#search'), qEl = $('#q'), rEl = $('#res');
function openSearch() { sEl.hidden = false; qEl.value = ''; renderFavs(); setTimeout(() => qEl.focus(), 50); }

  const now = mins(cur.time), rise = mins(D.sunrise[0]), set = mins(D.sunset[0]);
  const dist = Math.min(Math.abs(now - rise), Math.abs(now - set));
  const golden = Math.max(0, 1 - dist / 75);
  let top, bot;
  if (day) { top = hex('#1457c9'); bot = hex('#86c1f2'); }
  else { top = hex('#040814'); bot = hex('#122142'); }
  if (golden) { top = mix(top, hex(day ? '#2a4d9e' : '#1c2c5a'), golden * .8); bot = mix(bot, hex('#f29a5c'), golden * .85); }
  const grey = day ? [hex('#46556b'), hex('#7f8c9e')] : [hex('#0b1020'), hex('#2a3448')];
  top = mix(top, grey[0], cc * .85); bot = mix(bot, grey[1], cc * .85);
  if (rainy) { top = mix(top, hex(day ? '#36465c' : '#0a0f1c'), .6); bot = mix(bot, hex(day ? '#7b8da4' : '#263142'), .6); }
  if (snowy) { top = mix(top, hex(day ? '#8f9db1' : '#1b2436'), .7); bot = mix(bot, hex(day ? '#e3e9f1' : '#3c475c'), .7); }
  if (storm) { top = mix(top, hex('#151a26'), .8); bot = mix(bot, hex('#4a5366'), .7); }
  if (fog) { top = mix(top, hex(day ? '#98a2ad' : '#1e242e'), .8); bot = mix(bot, hex(day ? '#cfd5dc' : '#3a4350'), .8); }
  document.documentElement.dataset.ink = lum(bot) > 0.66 && lum(top) > 0.5 ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').setAttribute('content', rgb(top));
  const intensity = Math.min(1, (cur.precipitation ?? 0) / 3 + (rainy || snowy ? .25 : 0));
  const prog = set > rise ? (now - rise) / (set - rise) : .5;
  const windK = Math.min(1, (cur.wind_speed_10m ?? 10) / 60), windDir = ((cur.wind_direction_10m ?? 270) > 180 ? 1 : -1);
  sky = { top, bot, day, cc, rainy, snowy, storm, fog, intensity, stars: !day && cc < .5, prog, golden, windK, windDir, showSun: day && cc < .85 && !fog, showMoon: !day && cc < .7 && !fog };
  drawStatic(); buildLayers();
  clearTimeout(skyTimer); skyTimer = setTimeout(() => { if (data) paintSky(data.main); }, 5 * 60 * 1000);
}

function drawStatic() {
  if (!sky) return;
  const dpr = Math.min(1.5, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, rgb(sky.top)); g.addColorStop(1, rgb(sky.bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // horizon band
  if (sky.day) { const hg = ctx.createLinearGradient(0, H * .35, 0, H * .8); hg.addColorStop(0, 'rgba(255,255,255,0)'); hg.addColorStop(.6, `rgba(255,${sky.golden ? 200 : 255},${sky.golden ? 160 : 255},${.1 + sky.golden * .18})`); hg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H); }
  // stars
  if (sky.stars) { ctx.fillStyle = '#fff'; for (let i = 0; i < 110; i++) { ctx.globalAlpha = .3 + Math.random() * .7; ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H * .7, Math.random() * 1.1 + .3, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  // sun / moon
  if (sky.showSun || sky.showMoon) {
    const sx = W * (.12 + .76 * (sky.showSun ? sky.prog : .7)), sy = H * (sky.showSun ? .32 - .22 * Math.sin(sky.prog * Math.PI) : .14);
    const col = sky.showSun ? (sky.golden ? '255,170,90' : '255,235,170') : '220,228,245';
    const gl = ctx.createRadialGradient(sx, sy, 0, sx, sy, sky.showSun ? 280 : 150);
    gl.addColorStop(0, `rgba(${col},${sky.showSun ? .6 : .35})`); gl.addColorStop(.25, `rgba(${col},${sky.showSun ? .2 : .1})`); gl.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(${col},.95)`; ctx.beginPath(); ctx.arc(sx, sy, sky.showSun ? 34 : 22, 0, 7); ctx.fill();
    if (!sky.showSun) { ctx.fillStyle = rgb(sky.top); ctx.beginPath(); ctx.arc(sx + 10, sy - 6, 19, 0, 7); ctx.fill(); }
  }
  // ground haze + vignette
  const hz = ctx.createLinearGradient(0, H * .6, 0, H); hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, sky.day && !sky.rainy && !sky.storm ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.3)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.26)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function cloudSprite(col, alpha) {
  const S = 360, c = document.createElement('canvas'); c.width = S; c.height = S / 2; const g = c.getContext('2d');
  const blobs = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < blobs; i++) {
    const bx = S * (.18 + Math.random() * .64), by = S / 2 * (.5 + Math.random() * .28) - Math.random() * S * .07, r = S * (.08 + Math.random() * .12);
    const rg = g.createRadialGradient(bx, by, r * .15, bx, by, r);
    rg.addColorStop(0, `rgba(${col},${alpha})`); rg.addColorStop(.6, `rgba(${col},${alpha * .55})`); rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg; g.beginPath(); g.ellipse(bx, by, r * 1.4, r * .9, 0, 0, 7); g.fill();
  }
  const base = g.createLinearGradient(0, S / 2 * .5, 0, S / 2); base.addColorStop(0, 'rgba(0,0,0,0)'); base.addColorStop(1, `rgba(0,0,0,${alpha * .3})`);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = base; g.fillRect(0, 0, S, S / 2); g.globalCompositeOperation = 'source-over';
  return c.toDataURL('image/png');
}
function rainTile(snow, dir) {
  const S = 256, c = document.createElement('canvas'); c.width = S; c.height = S; const g = c.getContext('2d');
  if (snow) { g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 22; i++) { g.beginPath(); g.arc(Math.random() * S, Math.random() * S, .8 + Math.random() * 1.6, 0, 7); g.fill(); } }
  else { g.strokeStyle = 'rgba(205,225,250,.42)'; g.lineWidth = 1; g.lineCap = 'round'; for (let i = 0; i < 26; i++) { const x = Math.random() * S, y = Math.random() * S, l = 14 + Math.random() * 16; g.beginPath(); g.moveTo(x, y); g.lineTo(x - dir * 2.5, y + l); g.stroke(); } }
  return c.toDataURL('image/png');
}
function buildLayers() {
  if (!sky) return;
  layer.innerHTML = '';
  const W = innerWidth, H = innerHeight;
  const colS = sky.day ? (sky.rainy || sky.storm ? '150,162,180' : sky.cc > .6 ? '205,214,226' : '255,255,255') : '60,72,96';
  const sprites = Array.from({ length: 4 }, () => cloudSprite(colS, sky.day && sky.cc > .6 ? .75 : .85));
  const n = Math.round(3 + sky.cc * 8);
  for (let i = 0; i < n; i++) {
    const r = 60 + Math.random() * 150, w = r * 4.4, h = r * 2.2;
    const el = document.createElement('div'); el.className = 'cl';
    const dur = (W + w) / ((6 + Math.random() * 10) * (1 + sky.windK * 2.5)); // seconds
    el.style.cssText = `width:${w}px;height:${h}px;top:${Math.random() * H * .5 - h / 2}px;left:0;opacity:${(sky.day && sky.cc > .6 ? .55 : .75) + Math.random() * .25};background-image:url(${sprites[i % 4]});animation-duration:${dur.toFixed(1)}s;animation-delay:-${(Math.random() * dur).toFixed(1)}s;animation-name:${sky.windDir > 0 ? 'driftR' : 'driftL'};--w:${w}px;--vw:${W}px`;
    layer.appendChild(el);
  }
  if (sky.rainy || sky.snowy || sky.storm) {
    const el = document.createElement('div'); el.className = 'px' + (sky.snowy ? ' snow' : '');
    el.style.backgroundImage = `url(${rainTile(sky.snowy, sky.windDir)})`;
    el.style.opacity = (.35 + sky.intensity * .5).toFixed(2);
    el.style.animationDuration = sky.snowy ? '9s' : (1.1 - sky.intensity * .4).toFixed(2) + 's';
    layer.appendChild(el);
  }
  if (sky.storm) { const f = document.createElement('div'); f.className = 'flash'; layer.appendChild(f); }
}
let rsz; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { drawStatic(); buildLayers(); }, 200); });
/* ---------- start ---------- */
const askedGeo = loc && loc.name !== 'Mein Standort';
if (loc) loadFor(loc, false);
if (!askedGeo) locate(false);
setInterval(() => { if (loc && !document.hidden) loadFor(loc, true); }, 20 * 60 * 1000);
})();
</script>
